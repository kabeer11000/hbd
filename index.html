<audio id="music" src="song.mp3"></audio>

<script>
// browsers dont let music autoplay so it starts on the first click/tap anywhere
// starts from 30s (the good part)
var music = document.getElementById("music");
music.volume = 0.5;
var started = false;
function startMusic() {
  if (started) return;
  started = true;
  music.currentTime = 30;
  music.play();
}
document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);
// when it ends go back to 30s again
music.addEventListener("ended", function() {
  music.currentTime = 30;
  music.play();
});

var clicks = 0;
var msgs = ["again", "again!!", "one more", "ok last one", "i like u btw"];

function hearts() {
  for (var i = 0; i < 25; i++) {
    var h = document.createElement("div");
    h.className = "heart";
    // optp.png has to be in the same folder as this file
    var optp = '<img src="optp.png" width="70" onerror="this.outerHTML=\'🍟\'">';
    h.innerHTML = ["❤️","💕",optp,optp,"💖"][Math.floor(Math.random()*5)];
    h.style.left = Math.random() * 100 + "%";
    h.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(h);
  }
  document.getElementById("msg").innerHTML = msgs[Math.min(clicks, msgs.length-1)];
  clicks++;
}
</script>
